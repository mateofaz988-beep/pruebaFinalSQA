{% extends 'biblioteca/base.html' %}

{% block content %}
<h2>Confirmar Eliminación</h2>

<div class="alert alert-warning mt-4">
    <p>¿Estás seguro de que deseas eliminar el libro <strong>{{ libro.titulo }}</strong>?</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'listar_libros' %}" class="btn btn-cancelar">Cancelar</a>
</form>
{% endblock %}
